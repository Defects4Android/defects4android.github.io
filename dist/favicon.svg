<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="#3DDC84"/>

  <!-- Simplified Android head -->
  <!-- Antenna left -->
  <line x1="11" y1="9" x2="9" y2="6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Antenna right -->
  <line x1="21" y1="9" x2="23" y2="6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head / body rounded rect -->
  <rect x="8" y="10" width="16" height="11" rx="5" fill="white"/>

  <!-- Eyes -->
  <circle cx="13" cy="15" r="1.3" fill="#3DDC84"/>
  <circle cx="19" cy="15" r="1.3" fill="#3DDC84"/>

  <!-- Body / legs -->
  <rect x="10" y="21" width="3" height="5" rx="1.5" fill="white"/>
  <rect x="19" y="21" width="3" height="5" rx="1.5" fill="white"/>
  <rect x="8" y="20" width="16" height="4" rx="1" fill="white"/>
</svg>
